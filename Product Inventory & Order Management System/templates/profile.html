{% extends "base.html" %}
{% block title %}My Profile - InventoryHub{% endblock %}
{% block content %}
<h4 class="mb-4">My Profile</h4>
<div class="row g-4">
  <div class="col-md-6">
    <div class="card p-4">
      <h6 class="mb-3">Account Details</h6>
      <form method="POST" action="{{ url_for('buyer.profile') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
          <div class="form-text">Email cannot be changed.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone number</label>
          <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-4">
      <h6 class="mb-3">Change Password</h6>
      <form method="POST" action="{{ url_for('buyer.change_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Current password</label>
          <input type="password" name="current_password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" name="new_password" class="form-control" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input type="password" name="confirm_password" class="form-control" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-outline-primary">Change Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
